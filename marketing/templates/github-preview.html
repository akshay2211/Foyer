<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="foyer.css">
<style>
  html, body { width: 1280px; height: 640px; }
  .fg-glow {
    position: absolute; inset: 0;
    background: radial-gradient(760px 500px at 84% 16%, var(--accent), transparent 70%);
    opacity: 0.10;
  }
  .text { position: absolute; left: 88px; top: 50%; transform: translateY(-50%); width: 680px; }
  .repo { display: flex; align-items: center; gap: 11px; font-size: 20px; font-weight: 500; color: var(--muted); }
  .repo img { width: 28px; height: 28px; border-radius: 7px; display: block; }
  .repo b { color: var(--ink); font-weight: 600; }
  h1 { margin-top: 24px; font-size: 62px; line-height: 1.06; font-weight: 600; letter-spacing: -0.02em; }
  h1 em { font-style: normal; color: var(--accent-bright); }
  .lede { margin-top: 20px; font-size: 21px; line-height: 1.5; letter-spacing: -0.005em; color: var(--muted); }
  .chips { margin-top: 28px; display: flex; gap: 9px; }
  .chips span {
    font-size: 15px; font-weight: 500;
    border: 1px solid #333332; border-radius: 999px;
    padding: 8px 18px; color: var(--ink);
  }
  .stage-right { position: absolute; right: 100px; top: 56px; }
  .ui-home[data-ui] { width: 316px; }
</style>
</head>
<body>
<div class="fg-glow"></div>
<div class="text">
  <div class="repo"><img src="../../website/assets/icon.png" alt="">akshay2211 / <b>Foyer</b></div>
  <h1>a <em>quiet</em> home for your phone</h1>
  <p class="lede">A text-first Android launcher with a fully on-device AI assistant. No server, no account, no analytics.</p>
  <div class="chips"><span>kotlin</span><span>compose</span><span>on-device ai</span><span>gpl-3.0</span></div>
</div>
<div class="stage-right"><div data-slot="home"></div></div>
<script src="ui-home.js"></script>
</body>
</html>
