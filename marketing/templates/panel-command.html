<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="foyer.css">
<style>
  html, body { width: 540px; height: 960px; }
  .stage { top: 250px; bottom: 0; flex-direction: column; justify-content: flex-start; gap: 0; padding: 24px 56px 0; align-items: stretch; }
  /* the command field, as on the website's live demo */
  .cmd {
    background: var(--field); color: var(--field-ink);
    border-radius: var(--radius);
    padding: 20px 22px;
    font-size: 19px; letter-spacing: -0.01em;
  }
  .cmd .caret { display: inline-block; width: 2px; height: 1.05em; background: var(--field-ink); vertical-align: text-bottom; margin-left: 1px; }
  .say { margin: 26px 0 10px; color: var(--muted); font-size: 13px; letter-spacing: 0.12em; }
  .plan {
    background: #fff; color: var(--field-ink);
    border-radius: var(--radius);
    padding: 10px 22px;
  }
  .ui-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 17px; padding: 15px 0;
    border-top: 1px solid #e4e4e4;
  }
  .ui-row:first-child { border-top: 0; }
  .ui-kind { font-size: 12px; color: var(--field-muted); letter-spacing: 0.06em; }
  .chips { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; }
  .chips span {
    background: var(--surface); color: var(--muted);
    border-radius: 999px; padding: 8px 14px; font-size: 13.5px;
  }
  .note { margin-top: 24px; text-align: center; color: var(--muted); font-size: 13px; letter-spacing: 0.04em; }
  .note b { color: var(--ink); font-weight: 500; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="brand"><img src="../../website/assets/icon.png" alt="">foyer</div>
<h1 class="caption" id="title"></h1>
<p class="sub" id="sub"></p>
<div class="stage">
  <div class="say">you say</div>
  <div class="cmd">turn on wifi and open spotify<span class="caret"></span></div>
  <div class="say" style="margin-top: 30px;">it does</div>
  <div class="plan">
    <div class="ui-row"><span>wifi settings</span><span class="ui-kind">setting</span></div>
    <div class="ui-row"><span>open spotify</span><span class="ui-kind">app</span></div>
  </div>
  <div class="chips">
    <span>set an alarm for 7:30</span>
    <span>message mom i'm on my way</span>
    <span>timer 10 minutes</span>
  </div>
  <p class="note">runs on a model <b>inside your phone</b> · works in airplane mode</p>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('title').innerHTML = q.get('title') || '';
  document.getElementById('sub').textContent = q.get('sub') || '';
</script>
</body>
</html>
