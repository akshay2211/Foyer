<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="foyer.css">
<style>
  html, body { width: 540px; height: 960px; }
  .stage { top: 250px; bottom: 36px; padding: 24px 62px 0; align-items: stretch; }
  /* home edit mode — grid dots, widget frames, handles, the done pill */
  .edit {
    flex: 1; display: flex; flex-direction: column;
    font-family: var(--app-font); color: #ececec;
    background-color: #0d0d10;
    background-image: radial-gradient(#2c2c31 1.6px, transparent 1.8px);
    background-size: 70px 92px;
    background-position: 35px 44px;
    border-radius: 22px;
    padding: 28px 26px 24px;
  }
  .wgt { border: 1.5px solid #3b3b3f; border-radius: 20px; padding: 24px; }
  .wgt-clock { text-align: center; }
  .eclock { font-size: 52px; font-weight: 100; letter-spacing: 0.05em; color: var(--app-clock); line-height: 1; }
  .edate { margin-top: 14px; font-size: 13.5px; color: #9a9a9e; letter-spacing: 0.02em; }
  .wgt-faves {
    margin-top: 22px; width: 64%; flex: 1;
    display: grid; gap: 20px; align-content: start;
    font-size: 19px; position: relative;
    border-color: var(--accent); border-width: 2px;
  }
  .hdl { position: absolute; background: var(--accent); border-radius: 999px; }
  .h-t { top: -4px; left: 50%; transform: translateX(-50%); width: 30px; height: 7px; }
  .h-b { bottom: -4px; left: 50%; transform: translateX(-50%); width: 30px; height: 7px; }
  .h-l { left: -4px; top: 50%; transform: translateY(-50%); width: 7px; height: 30px; }
  .h-r { right: -4px; top: 50%; transform: translateY(-50%); width: 7px; height: 30px; }
  .chips { margin-top: auto; display: flex; gap: 10px; justify-content: center; }
  .chip { font-size: 14px; color: #737377; border: 1px solid #3b3b3f; border-radius: 999px; padding: 7px 18px; }
  .chip.on { color: var(--accent-bright); border-color: var(--accent); }
  .done {
    margin: 18px auto 0; width: fit-content;
    background: var(--accent); color: #fff;
    font-size: 16px; border-radius: 999px; padding: 11px 34px;
  }
</style>
</head>
<body>
<div class="glow"></div>
<div class="brand"><img src="../../website/assets/icon.png" alt="">foyer</div>
<h1 class="caption" id="title"></h1>
<p class="sub" id="sub"></p>
<div class="stage">
  <div class="edit">
    <div class="wgt wgt-clock">
      <p class="eclock">11:11</p>
      <p class="edate">saturday, nov 7 · 1h 34m today</p>
    </div>
    <div class="wgt wgt-faves">
      <span class="hdl h-t"></span><span class="hdl h-b"></span><span class="hdl h-l"></span><span class="hdl h-r"></span>
      <span>calendar</span><span>gemini</span><span>whatsapp</span>
    </div>
    <div class="chips"><span class="chip">5×8</span><span class="chip on">6×10</span><span class="chip">7×12</span></div>
    <span class="done">done</span>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('title').innerHTML = q.get('title') || '';
  document.getElementById('sub').textContent = q.get('sub') || '';
</script>
</body>
</html>
