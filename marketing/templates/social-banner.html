<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="foyer.css">
<style>
  html, body { width: 1200px; height: 630px; }
  .fg-glow {
    position: absolute; inset: 0;
    background: radial-gradient(760px 500px at 82% 18%, var(--accent), transparent 70%);
    opacity: 0.10;
  }
  .text { position: absolute; left: 80px; top: 50%; transform: translateY(-50%); width: 640px; }
  .brand { margin: 0; font-size: 21px; }
  .brand img { width: 30px; height: 30px; border-radius: 7px; }
  h1 { margin-top: 26px; font-size: 64px; line-height: 1.06; font-weight: 600; letter-spacing: -0.02em; }
  h1 em { font-style: normal; color: var(--accent-bright); }
  .lede { margin-top: 20px; font-size: 22px; line-height: 1.5; letter-spacing: -0.005em; color: var(--muted); }
  .url { margin-top: 26px; font-size: 18px; font-weight: 500; color: var(--ink); }
  .stage-right { position: absolute; right: 96px; top: 58px; }
  .ui-home[data-ui] { width: 306px; }
</style>
</head>
<body>
<div class="fg-glow"></div>
<div class="text">
  <div class="brand"><img src="../../website/assets/icon.png" alt="">foyer</div>
  <h1>a <em>quiet</em> home for your phone</h1>
  <p class="lede">A text-first Android launcher with a fully on-device AI assistant. Airplane mode changes nothing.</p>
  <div class="url">foyerlauncher.com</div>
</div>
<div class="stage-right"><div data-slot="home"></div></div>
<script src="ui-home.js"></script>
</body>
</html>
