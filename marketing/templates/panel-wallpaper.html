<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="foyer.css">
<style>
  html, body { width: 540px; height: 960px; }
  .stage { top: 250px; bottom: 36px; padding: 24px 62px 0; align-items: stretch; }
  /* theme from wallpaper — the photo, the switch, the two pulled colours */
  .wall {
    flex: 1; display: flex; flex-direction: column;
    font-family: var(--app-font); color: #ececec;
    background: #0d0d10; border-radius: 22px;
    padding: 0 0 26px; overflow: hidden;
  }
  .wp svg { display: block; width: 100%; height: 230px; }
  .trow {
    display: flex; justify-content: space-between; align-items: center;
    padding: 26px 28px 0; font-size: 18px;
  }
  .wtoggle { flex: none; width: 48px; height: 28px; border-radius: 14px; background: #c2342e; position: relative; }
  .wtoggle::after { content: ""; position: absolute; right: 4px; top: 4px; width: 20px; height: 20px; border-radius: 50%; background: #fff; }
  .pulls { display: flex; align-items: center; gap: 13px; padding: 24px 28px 0; }
  .pdot { flex: none; width: 27px; height: 27px; border-radius: 50%; border: 1px solid #3b3b3f; }
  .plabel { font-size: 13.5px; color: #9a9a9e; line-height: 1.45; }
  .wclock {
    margin: auto auto 10px; font-size: 58px; font-weight: 100;
    letter-spacing: 0.05em; color: var(--app-clock); line-height: 1;
  }
  .wclock b { font-weight: 100; color: #c2342e; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="brand"><img src="../../website/assets/icon.png" alt="">foyer</div>
<h1 class="caption" id="title"></h1>
<p class="sub" id="sub"></p>
<div class="stage">
  <div class="wall">
    <div class="wp">
      <svg viewBox="0 0 200 104" preserveAspectRatio="xMidYMid slice">
        <rect width="200" height="104" fill="#0a0a0c"/>
        <circle cx="102" cy="48" r="32" fill="#c2342e"/>
        <path d="M0 104 55 50l30 30 28-38 44 44 43-30v48z" fill="#17171a"/>
        <path d="M0 104 55 50l30 30 28-38 44 44 43-30" fill="none" stroke="#3b3b3f" stroke-width="1"/>
      </svg>
    </div>
    <div class="trow"><span>theme from wallpaper</span><span class="wtoggle"></span></div>
    <div class="pulls">
      <span class="pdot" style="background:#0a0a0c"></span>
      <span class="pdot" style="background:#c2342e"></span>
      <span class="plabel">background &amp; accent,<br>pulled from your photo</span>
    </div>
    <p class="wclock">11:<b>11</b></p>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('title').innerHTML = q.get('title') || '';
  document.getElementById('sub').textContent = q.get('sub') || '';
</script>
</body>
</html>
