<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="foyer.css">
<style>
  html, body { width: 540px; height: 960px; }
  .stage { top: 232px; align-items: flex-start; }
  .phone { margin-top: 24px; }
  .ui-home[data-ui] { width: 334px; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="brand"><img src="../../website/assets/icon.png" alt="">foyer</div>
<h1 class="caption" id="title"></h1>
<p class="sub" id="sub"></p>
<div class="stage">
  <div class="phone">
    <span class="key key-vol"></span><span class="key key-pwr"></span>
    <div class="ui-home" data-ui id="home">
      <div class="ui-status">
        <span>11:11</span>
        <svg viewBox="0 0 46 12" width="46" height="12" fill="#f0f0f0">
          <rect x="0" y="7" width="2" height="5" rx="0.8"/><rect x="3.5" y="5" width="2" height="7" rx="0.8"/><rect x="7" y="3" width="2" height="9" rx="0.8"/><rect x="10.5" y="1" width="2" height="11" rx="0.8"/>
          <path d="M18 6.6 a6.4 6.4 0 0 1 9 0 l-1.5 1.6 a4.2 4.2 0 0 0 -6 0 z"/><circle cx="22.5" cy="10.4" r="1.7"/>
          <rect x="32" y="2" width="12" height="9" rx="4.5"/><text x="38" y="9.2" font-size="6.4" font-weight="700" fill="#101013" text-anchor="middle">100</text>
        </svg>
      </div>
      <div class="ui-top">
        <p class="ui-clock">11:11</p>
        <p class="ui-date">saturday, nov 7 · 1h 34m today</p>
      </div>
      <div class="ui-apps">
        <span>calendar</span>
        <span>gemini</span>
        <span>skimbyte</span>
        <span>whatsapp</span>
      </div>
      <div class="ui-dock">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#d6d6d6" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h1l2 -3h8l2 3h1a2 2 0 0 1 2 2v9a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-9a2 2 0 0 1 2 -2z"/><circle cx="12" cy="13" r="3"/></svg>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#d6d6d6" stroke-width="1.3" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M4.5 14.5 c3 -3.5 6 1 9 -1 s4 -3.5 6 -5"/></svg>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#d6d6d6" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5l-2.5 1.5a11 11 0 0 0 5 5l1.5 -2.5l5 2v4a2 2 0 0 1 -2 2a16 16 0 0 1 -15 -15a2 2 0 0 1 2 -2z"/></svg>
      </div>
      <span class="ui-gesture"></span>
    </div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('title').innerHTML = q.get('title') || '';
  document.getElementById('sub').textContent = q.get('sub') || '';
  if (q.get('theme') === 'light') document.getElementById('home').classList.add('light');
</script>
</body>
</html>
