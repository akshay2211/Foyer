<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="foyer.css">
<style>
  html, body { width: 540px; height: 960px; }
  .stage { top: 250px; bottom: 0; flex-direction: column; justify-content: flex-start; gap: 16px; padding: 24px 62px 0; align-items: stretch; }
  .group-label { font-size: 12px; letter-spacing: 0.18em; color: #737377; font-family: var(--app-font); margin: 10px 0 -6px 4px; }
  .card {
    background: var(--app-bg);
    border-radius: 18px;
    padding: 20px 24px;
    font-family: var(--app-font);
    display: flex; align-items: center; justify-content: space-between;
  }
  /* accent swatches */
  .dots { display: flex; gap: 16px; }
  .dot { width: 34px; height: 34px; border-radius: 50%; position: relative; }
  .dot.sel::after {
    content: ""; position: absolute; inset: -6px;
    border: 2px solid #d93036; border-radius: 50%;
  }
  .dot.sel::before {
    content: "✓"; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 15px;
  }
  .side { color: #9a9a9e; font-size: 16px; }
  /* font choices */
  .fonts { display: grid; gap: 12px; }
  .fonts .card { padding: 18px 24px; }
  .fname { font-size: 19px; color: #ececec; }
  .radio { width: 20px; height: 20px; border: 2px solid #5c5c60; border-radius: 50%; position: relative; }
  .radio.sel { border-color: #d93036; }
  .radio.sel::after { content: ""; position: absolute; inset: 3px; background: #d93036; border-radius: 50%; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="brand"><img src="../../website/assets/icon.png" alt="">foyer</div>
<h1 class="caption" id="title"></h1>
<p class="sub" id="sub"></p>
<div class="stage">
  <div class="group-label">accent</div>
  <div class="card">
    <div class="dots">
      <span class="dot" style="background:#ececec"></span>
      <span class="dot sel" style="background:#d93036"></span>
      <span class="dot" style="background:#3a6bf0"></span>
      <span class="dot" style="background:#2a9d61"></span>
    </div>
    <span class="side">red</span>
  </div>
  <div class="group-label">font</div>
  <div class="fonts">
    <div class="card"><span class="fname" style="font-family: Roboto, 'Helvetica Neue', sans-serif;">inter</span><span class="radio sel"></span></div>
    <div class="card"><span class="fname" style="font-family: 'Courier New', monospace;">mono</span><span class="radio"></span></div>
    <div class="card"><span class="fname" style="font-family: Georgia, serif;">serif</span><span class="radio"></span></div>
  </div>
  <div class="group-label">background</div>
  <div class="card">
    <div class="dots">
      <span class="dot" style="background:#101013; border: 1px solid #3a3a3e;"></span>
      <span class="dot sel" style="background:#000"></span>
      <span class="dot" style="background:#1a140e; border: 1px solid #3a3a3e;"></span>
      <span class="dot" style="background:#fdfdfb"></span>
      <span class="dot" style="background:#f2e9d8"></span>
    </div>
    <span class="side">true black</span>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('title').innerHTML = q.get('title') || '';
  document.getElementById('sub').textContent = q.get('sub') || '';
</script>
</body>
</html>
