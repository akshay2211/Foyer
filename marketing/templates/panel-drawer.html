<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="foyer.css">
<style>
  html, body { width: 540px; height: 960px; }
  .stage { top: 250px; bottom: 0; align-items: flex-start; padding-top: 26px; }
  /* a piece of the drawer, not the whole screen */
  .drawer {
    width: 380px; height: 100%;
    background: var(--app-bg);
    border-radius: 18px 18px 0 0;
    padding: 26px 56px 0 28px;
    position: relative;
    font-family: var(--app-font);
    font-size: 19px;
  }
  .ui-search {
    background: #1b1b1f; color: #8a8a8e;
    border-radius: 999px;
    padding: 12px 18px;
    font-size: 16px;
    width: fit-content; min-width: 150px;
  }
  .ui-search b { color: #ececec; font-weight: 400; }
  .label { margin: 26px 0 4px; font-size: 12px; letter-spacing: 0.22em; color: #737377; }
  .apps { display: grid; gap: 21px; margin-top: 18px; color: #ececec; }
  .apps b { font-weight: 400; color: #fff; }
  .apps .dim { color: #55555a; }
  /* the a–z rail, with the fisheye around the active letter */
  .rail {
    position: absolute; right: 18px; top: 30px; bottom: 24px;
    display: flex; flex-direction: column; justify-content: space-between; align-items: center;
    font-size: 11px; color: #5c5c60; font-family: var(--app-font);
  }
  .rail span.near { color: #9a9a9e; font-size: 13px; }
  .rail span.on { color: #d93036; font-size: 17px; font-weight: 600; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="brand"><img src="../../website/assets/icon.png" alt="">foyer</div>
<h1 class="caption" id="title"></h1>
<p class="sub" id="sub"></p>
<div class="stage">
  <div class="drawer">
    <div class="ui-search"><b>in</b>sta</div>
    <div class="label">best match</div>
    <div class="apps">
      <span><b>insta</b>gram</span>
      <span class="dim">l<b style="color:#ececec">in</b>kedin</span>
      <span class="dim">p<b style="color:#ececec">in</b>terest</span>
    </div>
    <div class="label" style="margin-top: 34px;">frequently used</div>
    <div class="apps">
      <span>whatsapp</span>
      <span>youtube</span>
      <span>camera</span>
      <span>maps</span>
    </div>
    <div class="rail" id="rail"></div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('title').innerHTML = q.get('title') || '';
  document.getElementById('sub').textContent = q.get('sub') || '';

  const rail = document.getElementById('rail');
  for (const c of 'abcdefghijklmnopqrstuvwxyz') {
    const s = document.createElement('span');
    s.textContent = c;
    if (c === 'i') s.className = 'on';
    else if (c === 'h' || c === 'j') s.className = 'near';
    rail.appendChild(s);
  }
</script>
</body>
</html>
