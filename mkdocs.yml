site_name: foyer
site_description: a quiet, text-first Android launcher with a fully on-device AI assistant
site_url: https://foyerlauncher.com/docs/
repo_url: https://github.com/akshay2211/Foyer
repo_name: akshay2211/Foyer
edit_uri: edit/main/docs/

theme:
  name: material
  favicon: assets/favicon.png
  logo: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-7
        name: dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - content.action.edit

nav:
  - home: index.md
  - design guide: DESIGN_GUIDE.md
  - the assistant: assistant.md
  - privacy: privacy.md
  - terms: terms.md
  - contributing: contributing.md
  - api reference: /api/

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/akshay2211/Foyer
